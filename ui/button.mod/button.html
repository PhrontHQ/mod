<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="button.css" />
        <script type="text/montage-serialization">
            {
                "owner": {
                    "values": {
                        "element": {"#": "owner"}
                    }
                },
                "defaultLabel": {
                    "prototype": "ui/text.mod",
                    "values": {
                        "element": {"#": "default-label"},
                        "value": {"<-": "@owner.label"}
                    }
                }
            }
        </script>
    </head>
    <body>
        <button data-mod-id="owner" class="ModButton">
            <div data-param="visual" class="ModButton-visual"></div>
            <div data-param="label" class="ModButton-label">
                <span data-mod-id="default-label">Button</span>
            </div>
        </button>
    </body>
</html>
