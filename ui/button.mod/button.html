<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="button.css" />
        <script type="text/montage-serialization">
            {
                "owner": {
                    "values": {
                        "element": {"#": "owner"}
                    }
                },
                "labeled-visual": {
                    "prototype": "ui/labeled-visual.mod",
                    "values": {
                        "element": {"#": "labeled-visual"},
                        "label": {"<-": "@owner.label"},
                        "defaultLabel": {"<-": "@owner.defaultLabel"},
                        "visualPosition": {"<-": "@owner.visualPosition"},
                        "visualOrientation": {"<-": "@owner.visualOrientation"},
                        "displayOptions": {"<-": "@owner.displayOptions"}
                    }
                }
            }
        </script>
    </head>
    <body>
        <button data-mod-id="owner" class="ModButton">
            <div data-mod-id="labeled-visual" class="ModButton-labeled-visual">
                <div data-param="visual" class="ModButton-visual"></div>
            </div>
        </button>
    </body>
</html>
