<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="organization.css">
    <script type="text/mod-serialization">
        {
            "owner": {
                "values": {
                    "element": {"#": "owner"},
                    "roleSelection": {"<-": "@roleList.selection"}
                }
            },
            "roleList": {
                "prototype": "../../../../ui/repetition.mod",
                "values": {
                    "element": {"#": "roleList"},
                    "contentController": {"@": "roleListController"},
                    "isSelectionEnabled": true
                }
            },
            "roleListController": {
                "prototype": "../../../../core/range-controller",
                "values": {
                    "content": {"<-": "@owner.data.suborganizations.map{jobRoles}.flatten()"}
                }
            },
            "roleListItem": {
                "prototype": "../../../../ui/list-item-menu.mod",
                "values": {
                    "element": {"#": "roleListItem"},
                    "data": {"<-": "@roleList:iteration.object.name"},
                    "object": {"<-": "@roleList:iteration.object"},
                    "minDistanceBeforeClose": 1200
                }
            },
            "delete": {
                "prototype": "../../../../ui/button.mod",
                "values": {
                    "element": {"#": "delete"},
                    "label": "Delete"
                }
            }
        }
    </script>
</head>
<body>
    <div data-mod-id="owner" class="OrganizationInspector">
        <div class="field">
            <div class="roleList" data-mod-id="roleList">
                <div class="roleListItem">
                    <div data-mod-id="roleListItem" class="roleListItemName">
                        <div data-arg="options-right">
                            <button data-mod-id="delete" class="delete"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
